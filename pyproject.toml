[project]
name = "costlab"
version = "0.2.0"
description = "Cost-attribution code and labs for the book AI FinOps (Fieldstone Analytics, synthetic)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rajesh Ranjan Mahapatra" }]
readme = "README.md"
dependencies = ["pydantic>=2.0", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.26", "scipy>=1.11", "duckdb>=1.0", "pandas>=2.0"]
labs = ["numpy>=1.26", "scipy>=1.11", "duckdb>=1.0", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["costlab*"]
